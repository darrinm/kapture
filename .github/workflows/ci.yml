name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        # Capture/TCC-dependent code is excluded from test targets (headless runners have no grants)
        run: swift test -Xswiftc -warnings-as-errors
